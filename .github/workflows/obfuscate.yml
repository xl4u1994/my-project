name: Encrypt Worker

permissions:
  contents: write

on:
  push:
    branches: [main]

jobs:
  encrypt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Encrypt worker.js
        run: node encrypt.js

      - name: Commit encrypted file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add worker.encrypted.js
          git commit -m "Auto-encrypt worker" || echo "Nothing to commit"
          git push
